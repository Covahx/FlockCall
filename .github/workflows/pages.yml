# Deploy the static site in /app to GitHub Pages.
# Repo → Settings → Pages → Source: GitHub Actions.
#
# Note: We intentionally omit actions/configure-pages. That action calls the
# "get Pages site" API, which returns 404 until a site exists, which breaks
# first-time setup for some repos. Plain static deploys do not require it.
name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
